<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cinema-online - Detalii Film</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --dark: #0a0a0f;
            --dark-2: #12121a;
            --dark-3: #1c1c28;
            --text: #f0ece0;
            --text-muted: #8a8474;
            --border: rgba(201,168,76,0.2);
        }
        body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; margin: 0; }
        nav { background: var(--dark-2); padding: 20px 50px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); text-decoration: none; font-weight: 900; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .movie-header { margin-bottom: 40px; border-left: 4px solid var(--gold); padding-left: 25px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; color: var(--gold); }
        .meta-info { margin-top: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-size: 0.9rem; }

        .section-box { background: var(--dark-2); border: 1px solid var(--border); padding: 35px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; font-size: 1.8rem; }

        label { display: block; margin-bottom: 10px; color: var(--gold); font-size: 0.8rem; letter-spacing: 1px; }
        select, textarea, input[type="number"] { width: 100%; background: var(--dark-3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 10px; font-family: inherit; outline: none; transition: 0.3s; }
        select:focus, textarea:focus { border-color: var(--gold); }

        .options-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 25px 0; }
        .option-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid transparent; transition: 0.3s; }
        .option-item:hover { border-color: rgba(201,168,76,0.3); background: rgba(201,168,76,0.05); }
        input[type="checkbox"] { accent-color: var(--gold); width: 18px; height: 18px; cursor: pointer; }

        .btn-submit { background: linear-gradient(135deg, var(--gold) 0%, #a87830 100%); color: var(--dark); border: none; padding: 15px 40px; font-weight: 700; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(201,168,76,0.3); }

        .sentiment-alert { margin-top: 25px; padding: 20px; background: rgba(201,168,76,0.1); border: 1px solid var(--gold); border-radius: 12px; font-style: italic; text-align: center; color: var(--gold); }
    </style>
</head>
<body>

<nav>
    <a href="/browse" class="logo">🎬 Cinema-online</a>
    <a href="/browse" style="color: var(--text-muted); text-decoration: none;">Inapoi la catalog</a>
</nav>

<div class="container">
    <div class="movie-header">
        <h1 th:text="${film['TITLU']}">Titlu Film</h1>
        <div class="meta-info">
            <span th:text="${film['CATEGORIE']}">CATEGORIE</span> •
            RATING ACTUAL: <span th:text="${film['RATING_MEDIU'] != null ? film['RATING_MEDIU'] : '0.00'}" style="color: var(--gold); font-weight: bold;">0.00</span>
        </div>
    </div>
    <div class="section-box">
        <h2>Vizionare</h2>
        <form th:action="@{/film/vizionare}" method="post">
            <input type="hidden" name="id_film" th:value="${film['ID_FILM']}">

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label>Format Video</label>
                    <select name="format">
                        <option th:each="f : ${formate}" th:text="${f}" th:value="${f}"></option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>Rezolutie</label>
                    <select name="rezolutie">
                        <option th:each="r : ${rezolutii}" th:text="${r}" th:value="${r}"></option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>Limba Audio</label>
                    <select name="limba">
                        <option th:each="l : ${limbi}" th:text="${l}" th:value="${l}"></option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit" style="background: #e50914; color: white; margin-top: 25px;">
                URMARESTE ACUM
            </button>
        </form>
    </div>

    <div class="section-box">
        <h2>Lasa o Recenzie</h2>

        <form th:action="@{/film/feedback}" method="post">
            <input type="hidden" name="id_film" th:value="${film['ID_FILM']}">

            <div style="max-width: 150px; margin-bottom: 20px;">
                <label>Nota ta (1-10)</label>
                <input type="number" name="nota" min="1" max="10" value="10">
            </div>

            <label>Comentariul tau</label>
            <textarea name="comentariu" rows="3" placeholder="Scrie parerea ta aici..." required></textarea>
            <label style="margin-top: 20px;">Ce ti-a placut la acest film?</label>
            <div class="options-grid">
                <div th:each="opt : ${optiuni}" class="option-item">
                    <input type="checkbox"
                           name="optiuni_id"
                           th:value="${opt['ID_OPTIUNE']}"
                           th:id="'opt-' + ${opt['ID_OPTIUNE']}">
                    <label th:for="'opt-' + ${opt['ID_OPTIUNE']}"
                           th:text="${opt['DENUMIRE']}"
                           style="margin-bottom: 0; cursor: pointer; color: var(--text);">
                    </label>
                </div>
            </div>
            <button type="submit" class="btn-submit">TRIMITE FEEDBACK</button>
        </form>
        <div class="sentiment-alert" th:if="${analizaSentiment}">
            <strong>Analiza Sentiment:</strong> <span th:text="${analizaSentiment}"></span>
        </div>
    </div>
</div>

</body>
</html>
