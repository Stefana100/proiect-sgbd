<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - Cinema-online</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --dark: #0a0a0f;
            --dark-2: #12121a;
            --dark-3: #1c1c28;
            --dark-4: #242434;
            --border: rgba(201,168,76,0.18);
            --text: #f0ece0;
            --text-muted: #8a8474;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: var(--dark); font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; overflow-x: hidden; }

        .left-panel { position: fixed; left: 0; top: 0; bottom: 0; width: 42%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .left-panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(0.7); }
        .film-grain { position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E"); opacity: 0.55; pointer-events: none; mix-blend-mode: overlay; }
        .overlay-gradient { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(10,10,15,0.3) 0%, rgba(10,10,15,0.0) 50%, rgba(10,10,15,0.6) 100%), linear-gradient(to top, rgba(10,10,15,0.95) 0%, transparent 55%); }
        .left-content { position: relative; z-index: 2; padding: 48px 52px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 36px; height: 36px; border: 2px solid var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .logo-tagline { font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 32px; }
        .left-heading { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; line-height: 1.2; margin-bottom: 18px; }
        .left-heading em { font-style: italic; color: var(--gold); }
        .left-desc { font-size: 0.92rem; line-height: 1.7; color: rgba(240,236,224,0.65); max-width: 340px; margin-bottom: 40px; }
        .film-strip { display: flex; gap: 8px; opacity: 0.7; }
        .strip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
        .strip-dot:nth-child(2) { opacity: 0.5; }
        .strip-dot:nth-child(3) { opacity: 0.3; }

        .right-panel { margin-left: 42%; width: 58%; min-height: 100vh; background: var(--dark-2); padding: 0 5vw; display: flex; flex-direction: column; justify-content: center; }
        .form-wrapper { max-width: 560px; margin: 0 auto; padding: 60px 0; width: 100%; }
        .form-header { margin-bottom: 40px; }
        .form-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(201,168,76,0.1); border: 1px solid var(--border); border-radius: 100px; padding: 5px 14px; font-size: 0.72rem; color: var(--gold); margin-bottom: 20px; text-transform: uppercase; }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        .form-title { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 700; line-height: 1.15; margin-bottom: 10px; }
        .form-subtitle { font-size: 0.9rem; color: var(--text-muted); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 7px; }
        .field.full { grid-column: 1 / -1; }
        label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); font-weight: 500; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; color: var(--text-muted); width: 16px; height: 16px; transition: color 0.2s; pointer-events: none; }
        input { width: 100%; background: var(--dark-3); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 13px 14px 13px 40px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.92rem; outline: none; transition: border-color 0.2s, background 0.2s; }
        input:focus { border-color: var(--gold); background: var(--dark-4); box-shadow: 0 0 0 3px rgba(201,168,76,0.12); }
        .input-wrap:focus-within .input-icon { color: var(--gold); }
        .phone-hint { font-size: 0.74rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }

        .submit-wrap { grid-column: 1 / -1; margin-top: 8px; display: flex; align-items: center; gap: 20px; }
        .btn-login { flex: 1; background: linear-gradient(135deg, var(--gold) 0%, #a87830 100%); color: #0a0a0f; border: none; border-radius: 10px; padding: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(201,168,76,0.35); }
        .register-link-inline { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
        .register-link-inline a { color: var(--gold); text-decoration: none; font-weight: 500; }

        .error-message { color: #ff4d4d; font-size: 0.8rem; margin-top: 8px; font-weight: 500; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 820px) { .left-panel { display: none; } .right-panel { margin-left: 0; width: 100%; } .submit-wrap { flex-direction: column; } }
    </style>
</head>
<body>

<div class="left-panel">
    <img src="https://images.unsplash.com/photo-1594908900066-3f47337549d8?w=1000&q=80" alt="Cinema">
    <div class="film-grain"></div>
    <div class="overlay-gradient"></div>
    <div class="left-content">
        <div class="logo">
            <div class="logo-icon">🎬</div>
            Cinema-online
        </div>
        <p class="logo-tagline">Platforma ta de cinema</p>
        <h1 class="left-heading">Lumea filmelor,<br/>la un click<br/><em>distanta.</em></h1>
        <p class="left-desc">Ne bucuram ca esti inapoi. Autentifica-te pentru a continua experienta.</p>
    </div>
</div>

<div class="right-panel">
    <div class="form-wrapper">
        <div class="form-header">
            <div class="form-badge"><div class="badge-dot"></div>Cont existent</div>
            <h2 class="form-title">Autentifica-te</h2>
            <p class="form-subtitle">Introdu datele tale pentru a accesa contul.</p>
        </div>

        <form th:action="@{/clienti/login}" method="post">
            <div class="form-grid">
                <div class="field">
                    <label>Nume</label>
                    <div class="input-wrap">
                        <input type="text" name="nume" placeholder="ex. Popescu" required>
                    </div>
                </div>
                <div class="field">
                    <label>Prenume</label>
                    <div class="input-wrap">
                        <input type="text" name="prenume" placeholder="ex. Andrei" required>
                    </div>
                </div>
                <div class="field full">
                    <label>Telefon Mobil</label>
                    <div class="input-wrap">
                        <input type="tel" name="telefon_mobil" placeholder="07XX XXX XXX" required>
                    </div>
                    <p class="phone-hint">Foloseste numarul inregistrat anterior.</p>

                    <p th:if="${eroare}" th:text="${eroare}" class="error-message"></p>
                </div>

                <div class="submit-wrap">
                    <button type="submit" class="btn-login">Intra in cont</button>
                    <span class="register-link-inline">
                        Nu ai cont? <a href="/register">Inregistreaza-te</a>
                    </span>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
