<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cinema-online - Vizionare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --dark: #0a0a0f;
            --dark-2: #12121a;
            --dark-3: #1c1c28;
            --text: #f0ece0;
            --text-muted: #8a8474;
            --border: rgba(201,168,76,0.2);
        }
        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        nav {
            background: var(--dark-2);
            padding: 20px 50px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); text-decoration: none; font-weight: 900; }

        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .screen-box {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.5), inset 0 0 50px rgba(201,168,76,0.05);
            overflow: hidden;
        }

        .screen-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
        }

        .movie-title {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .timer-display {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .timer-display span {
            font-size: 4rem;
            font-weight: 700;
            color: var(--gold);
            display: block;
            margin-bottom: 10px;
        }

        .timer-display p {
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .controls {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
        }

        .btn-exit {
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
        }

        .btn-exit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(229, 9, 20, 0.4);
        }

    </style>
</head>
<body>

<nav>
    <div class="logo">🎬 Cinema-online</div>
</nav>

<div class="player-container">
    <div class="movie-title" th:text="${film['TITLU']}">Titlu Film</div>

    <div class="screen-box">
        <div class="timer-display">
            <span id="counter">00:00</span>
            <p>Vizionare in curs</p>
        </div>
    </div>

    <div class="controls">
        <form th:action="@{/film/salveaza-vizualizare}" method="post" id="formVizualizare">
            <input type="hidden" name="idVersiune" th:value="${idVersiune}">
            <input type="hidden" name="idFilm" th:value="${film['ID_FILM']}">

            <input type="hidden" name="durataMinute" id="durataMinuteInput" value="0">

            <button type="submit" class="btn-exit">INCHIDE SI SALVEAZA PROGRESUL</button>
        </form>
    </div>
</div>

<script>
    let totalSeconds = 0;
    const counterElement = document.getElementById('counter');
    const durataInput = document.getElementById('durataMinuteInput');
    const form = document.getElementById('formVizualizare');

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
    }

    setInterval(() => {
        totalSeconds++;
        counterElement.innerText = formatTime(totalSeconds);
    }, 1000);

    form.addEventListener('submit', function() {
        const minuteDeSalvat = Math.floor(totalSeconds / 60);
        durataInput.value = minuteDeSalvat;
    });
</script>

</body>
</html>
