<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inregistrare - Cinema-online</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-light: #e8c96a;
            --dark: #0a0a0f;
            --dark-2: #12121a;
            --dark-3: #1c1c28;
            --dark-4: #242434;
            --surface: #1a1a26;
            --border: rgba(201,168,76,0.18);
            --text: #f0ece0;
            --text-muted: #8a8474;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: var(--dark); font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; overflow-x: hidden; }

        .left-panel { position: fixed; left: 0; top: 0; bottom: 0; width: 42%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .left-panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(0.7); }
        .overlay-gradient { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(10,10,15,0.3) 0%, rgba(10,10,15,0.0) 50%, rgba(10,10,15,0.6) 100%), linear-gradient(to top, rgba(10,10,15,0.95) 0%, transparent 55%); }
        .left-content { position: relative; z-index: 2; padding: 48px 52px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); display: flex; align-items: center; gap: 10px; }
        .left-heading { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; line-height: 1.2; margin-bottom: 18px; }
        .left-heading em { font-style: italic; color: var(--gold); }

        .right-panel { margin-left: 42%; width: 58%; min-height: 100vh; background: var(--dark-2); padding: 0 5vw; display: flex; flex-direction: column; justify-content: center; }
        .form-wrapper { max-width: 560px; margin: 0 auto; padding: 60px 0; width: 100%; }
        .form-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(201,168,76,0.1); border: 1px solid var(--border); border-radius: 100px; padding: 5px 14px; font-size: 0.72rem; color: var(--gold); margin-bottom: 20px; text-transform: uppercase; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 7px; }
        .field.full { grid-column: 1 / -1; }
        label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.1em; }

        .input-wrap { position: relative; display: flex; align-items: center; }
        input, select { width: 100%; background: var(--dark-3); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 13px 14px; color: var(--text); outline: none; }
        input:focus, select:focus { border-color: var(--gold); background: var(--dark-4); }

        .section-divider { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 8px 0; }
        .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
        .divider-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); }

        .date-row { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        .btn-register { width: 100%; background: linear-gradient(135deg, var(--gold) 0%, #a87830 100%); color: #0a0a0f; border: none; border-radius: 10px; padding: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .signin-link { text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); }
        .signin-link a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

<div class="left-panel">
    <img src="https://images.unsplash.com/photo-1594908900066-3f47337549d8?w=1000&q=80" alt="Cinema">
    <div class="overlay-gradient"></div>
    <div class="left-content">
        <div class="logo">Cinema-online</div>
        <h1 class="left-heading">Lumea filmelor,<br/>la un click<br/><em>distanta.</em></h1>
    </div>
</div>

<div class="right-panel">
    <div class="form-wrapper">
        <div class="form-header">
            <div class="form-badge">Cont nou</div>
            <h2 style="font-size: 2.4rem; margin-bottom: 10px;">Inregistreaza-te</h2>
        </div>

        <form th:action="@{/clienti/register}" method="post" id="regForm">
            <div class="form-grid">
                <div class="field">
                    <label>Nume</label>
                    <div class="input-wrap"><input type="text" name="nume" placeholder="ex. Popescu" required></div>
                </div>
                <div class="field">
                    <label>Prenume</label>
                    <div class="input-wrap"><input type="text" name="prenume" placeholder="ex. Andrei" required></div>
                </div>

                <div class="section-divider"><div class="divider-line"></div><span class="divider-label">Contact</span><div class="divider-line"></div></div>

                <div class="field full">
                    <label>Adresa Email</label>
                    <div class="input-wrap"><input type="email" name="email" placeholder="exemplu@email.com" required></div>
                </div>
                <div class="field">
                    <label>Telefon Acasa</label>
                    <div class="input-wrap"><input type="text" name="telefon_acasa" placeholder="0232 XXX XXX"></div>
                </div>
                <div class="field">
                    <label>Telefon Mobil</label>
                    <div class="input-wrap"><input type="text" name="telefon_mobil" placeholder="07XX XXX XXX"></div>
                </div>

                <div class="section-divider"><div class="divider-line"></div><span class="divider-label">Adresa</span><div class="divider-line"></div></div>

                <div class="field full">
                    <label>Adresa Stradala</label>
                    <div class="input-wrap"><input type="text" name="adresa" placeholder="Strada, Nr., Bloc, Ap." required></div>
                </div>
                <div class="field full">
                    <label>Oras</label>
                    <div class="input-wrap"><input type="text" name="oras" placeholder="ex. Iasi" required></div>
                </div>

                <div class="section-divider"><div class="divider-line"></div><span class="divider-label">Date Personale</span><div class="divider-line"></div></div>

                <div class="date-row">
                    <select id="zi"><option value="">Zi</option></select>
                    <select id="luna"><option value="">Luna</option></select>
                    <select id="an"><option value="">An</option></select>
                </div>

                <input type="hidden" name="data_nasterii" id="full_date">

                <button type="submit" class="btn-register">Creeaza cont</button>
                <p class="signin-link">Ai deja un cont? <a href="/login">Autentifica-te</a></p>
            </div>
        </form>
    </div>
</div>

<script>
    const zi = document.getElementById('zi');
    const an = document.getElementById('an');
    for(let i=1; i<=31; i++) zi.add(new Option(i < 10 ? '0'+i : i, i < 10 ? '0'+i : i));
    const luni = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    luni.forEach(l => document.getElementById('luna').add(new Option(l, l)));
    for(let i=2010; i>=1950; i--) an.add(new Option(i, i));

    document.getElementById('regForm').onsubmit = function() {
        const d = document.getElementById('zi').value;
        const m = document.getElementById('luna').value;
        const y = document.getElementById('an').value;
        if(!d || !m || !y) { alert('Te rugam sa alegi data nasterii'); return false; }
        document.getElementById('full_date').value = `${y}-${m}-${d}`;
    };
</script>

</body>
</html>
